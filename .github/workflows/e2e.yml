name: E2E Tests
on:
  repository_dispatch:
    types:
      # `ready` fires after the deployment is built and before Vercel evaluates
      # its Deployment Checks, which is the window a gate needs. `success`
      # fires too late to hold a production promotion.
      - vercel.deployment.ready
concurrency:
  # A single commit can produce both a preview and a production deployment, so
  # the environment has to be part of the key or the two runs cancel each other.
  group: ${{ github.workflow }}-${{ github.event.client_payload.git.sha }}-${{ github.event.client_payload.environment }}
  cancel-in-progress: true
permissions:
  contents: read
  statuses: write
jobs:
  e2e:
    name: E2E Tests
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      # Sets a pending commit status on the deployed SHA up front and the final
      # conclusion once the job ends. `github.sha` points at the default branch
      # for repository_dispatch events, so the status has to be written against
      # the payload's SHA instead - this action handles that. The environment is
      # part of the name so preview and production runs don't overwrite each
      # other's status.
      - name: Report status to Vercel
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "E2E Tests (${{ github.event.client_payload.environment }})"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.event.client_payload.environment }}
          path: playwright-report/
          retention-days: 30
