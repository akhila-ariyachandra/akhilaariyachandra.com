name: E2E Tests (Preview)
on:
  repository_dispatch:
    types:
      - vercel.deployment.success
concurrency:
  # Cancel a stale run if a newer deployment for the same commit succeeds
  group: ${{ github.workflow }}-${{ github.event.client_payload.git.sha }}
  cancel-in-progress: true
permissions:
  statuses: write
jobs:
  e2e:
    name: E2E Tests
    if: github.event_name == 'repository_dispatch'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    steps:
      # Runs are triggered by repository_dispatch, so GitHub always associates them with the
      # default branch and never surfaces them as a check on the PR for the tested commit.
      # Publishing a commit status on that SHA directly makes the result show up on any PR
      # containing it (e.g. the preview -> main promotion PR), same as the quality checks.
      - name: Set commit status to pending
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.client_payload.git.sha }}
        run: |
          curl --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            --header "authorization: Bearer $GH_TOKEN" \
            --header 'content-type: application/json' \
            --data '{
              "state": "pending",
              "context": "E2E Tests",
              "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            --fail

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Set commit status to result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.client_payload.git.sha }}
          STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          curl --request POST \
            --url "https://api.github.com/repos/${{ github.repository }}/statuses/$SHA" \
            --header "authorization: Bearer $GH_TOKEN" \
            --header 'content-type: application/json' \
            --data '{
              "state": "'"$STATE"'",
              "context": "E2E Tests",
              "target_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }' \
            --fail
