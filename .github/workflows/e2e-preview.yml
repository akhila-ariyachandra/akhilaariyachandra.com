name: E2E Tests (Preview)
on:
  repository_dispatch:
    types:
      - vercel.deployment.success
concurrency:
  # Cancel a stale run if a newer deployment for the same commit succeeds
  group: ${{ github.workflow }}-${{ github.event.client_payload.git.sha }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
jobs:
  e2e:
    name: E2E Tests
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.target != 'production'
    timeout-minutes: 60
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      STATUS_SHA: ${{ github.event.client_payload.git.sha }}
    steps:
      # github.sha points at the default branch for repository_dispatch events,
      # not the deployed commit, so the implicit Actions check never lands on
      # the PR's head commit. Create a check run on the real SHA instead so
      # branch protection can see it, and so the PR shows a live "in progress"
      # status rather than a static pending dot.
      - name: Create check run
        id: create-check
        run: |
          check_run_id=$(gh api "repos/${{ github.repository }}/check-runs" \
            -f name="E2E Tests" \
            -f head_sha="$STATUS_SHA" \
            -f status=in_progress \
            -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --jq '.id')
          echo "check_run_id=$check_run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.git.sha }}

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          BASE_URL: ${{ github.event.client_payload.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Complete check run
        if: always()
        run: |
          case "${{ job.status }}" in
            success) conclusion=success ;;
            cancelled) conclusion=cancelled ;;
            *) conclusion=failure ;;
          esac
          gh api "repos/${{ github.repository }}/check-runs/${{ steps.create-check.outputs.check_run_id }}" \
            -X PATCH \
            -f status=completed \
            -f conclusion="$conclusion" \
            -f details_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
