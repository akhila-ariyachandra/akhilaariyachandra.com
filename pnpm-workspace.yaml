allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

trustPolicy: no-downgrade

trustPolicyIgnoreAfter: 43200 # 1 month

update:
  githubActionsServer: true

# Let Varlock handle .env loading in Next.js, https://varlock.dev/integrations/nextjs/
overrides:
  "@next/env": "npm:@varlock/nextjs-integration@1.2.2"
